<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="潮枢智能订单确认和支付宝支付页面。">
<title>确认订单｜潮枢智能</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"></head>
<body>
<header class="topbar">
  <div class="container nav">
    <a class="brand" href="index.html" aria-label="潮枢智能首页">
      <div class="brand-icon" aria-hidden="true"><span>潮</span><span>枢</span></div>
      <div class="brand-name">潮枢智能</div>
    </a>
    <nav class="navlinks"><a class="" href="products.html">产品与服务</a><a class="" href="pricing.html">价格</a><a class="" href="about.html">关于我们</a></nav>
    <button class="mobile-menu" data-menu aria-label="打开菜单">☰</button>
  </div>
</header>

<main data-checkout>
  <section class="page-hero container">
    <div class="badge"><span class="badge-dot"></span> CHECKOUT</div>
    <h1>确认订单</h1>
    <p>核对商品和联系方式。支付宝电脑网站支付接口开通后，可将当前按钮直接接入正式收银台。</p>
  </section>

  <section class="container section" style="padding-top:28px">
    <div class="checkout-grid">
      <div class="form-card">
        <h2 style="margin-top:0">购买信息</h2>
        <div class="field">
          <label for="plan">选择套餐</label>
          <select id="plan">
            <option value="pdf-basic">PDF → Markdown · 个人版</option>
            <option value="media-pro">AI 图片 / 视频处理 · 专业版</option>
            <option value="insight-team">运营洞见 · 团队版</option>
          </select>
        </div>
        <div class="form-row">
          <div class="field"><label for="name">联系人</label><input id="name" placeholder="请输入联系人姓名"></div>
          <div class="field"><label for="email">邮箱 *</label><input id="email" type="email" placeholder="用于接收订单信息"></div>
        </div>
        <div class="field"><label for="company">公司 / 团队（可选）</label><input id="company" placeholder="公司或团队名称"></div>
        <div class="notice">本页面为正式支付接入前的订单场景。当前不收集或处理真实付款；支付宝接口审核通过后再启用支付按钮。</div>
      </div>

      <aside class="summary-card">
        <h2 style="margin-top:0">订单摘要</h2>
        <div class="summary-line"><span>商品</span><strong data-product></strong></div>
        <div class="summary-line"><span>套餐</span><strong data-planname></strong></div>
        <div class="summary-line"><span>价格</span><strong data-price></strong></div>
        <div class="summary-line total"><span>应付金额</span><strong data-total></strong></div>
        <button class="btn primary" data-pay style="width:100%;margin-top:18px">支付宝支付（开通中）</button>
        <p style="font-size:12px;color:#8394aa;line-height:1.7;margin-bottom:0">支付前请阅读 <a href="legal/terms.html" style="color:#78dfff">《用户协议》</a> 与 <a href="legal/privacy.html" style="color:#78dfff">《隐私政策》</a>。</p>
      </aside>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container footer-row">
    <div>© 2026 潮枢智能</div>
    <div>
      <a href="legal/privacy.html">隐私政策</a> ·
      <a href="legal/terms.html">用户协议</a> ·
      杭州潮枢智能科技有限公司 · www.chaoshuzhineng.cn
    </div>
  </div>
</footer>
<script src="assets/app.js"></script>
</body></html>
